<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="promptGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <!-- Base Plate -->
  <rect width="64" height="64" rx="16" fill="url(#bgDark)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#27272A" stroke-width="1.5" />

  <!-- Natural Language Input Glyph (>) -->
  <path d="M16 23 L24 31 L16 39" 
        stroke="#71717A" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Resolved Check Path -->
  <path d="M28 33 L36 41 L50 21" 
        stroke="url(#promptGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
